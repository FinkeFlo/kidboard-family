packages:
  - apps/*
  - packages/*
# Versions shared by several packages are declared once here (`catalog:` in package.json).
catalog:
  "@date-fns/tz": ^1.5.0
  "@types/node": ^22.20.5
  emojibase-data: ^18.0.0
  typescript: ~6.0.3
  zod: ^4.6.7
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
# Security: workbox-build (build-time only) pins glob ^11, which pulls vulnerable
# glob/minimatch (GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249). glob 14 keeps the
# globSync API workbox-build uses; drop this once workbox-build updates.
overrides:
  "workbox-build>glob": "^14.0.2"
